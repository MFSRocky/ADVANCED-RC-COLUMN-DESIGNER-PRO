<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cad">
<meta name="description" content="Offline RC column design to ACI 318-25 and BS 8110-1:1997">
<title>RC Column Designer Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/ui/styles.css">
<script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app" class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="assets/icons/app-icon.svg" alt="" class="brand-icon"><div><strong>RC Column</strong><span>Designer Pro</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer"><button id="themeToggle" class="btn ghost"><img src="assets/icons/moon.svg" class="icon" alt=""> Theme</button><span class="offline-badge" id="offlineBadge">Offline-ready</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button id="menuToggle" class="btn ghost only-mobile" aria-label="Menu"><img src="assets/icons/menu.svg" class="icon" alt=""></button>
      <div class="project-title"><input id="projectName" class="project-name-input" aria-label="Project name"><span id="saveStatus" class="save-status">Saved</span></div>
      <div class="topbar-actions">
        <select id="codeSelect" aria-label="Design code"><option value="ACI318-25">ACI 318-25</option><option value="BS8110-1997">BS 8110-1:1997</option></select>
        <button id="runDesign" class="btn primary"><img src="assets/icons/play.svg" class="icon" alt=""> Design</button>
        <button id="saveProject" class="btn"><img src="assets/icons/save.svg" class="icon" alt=""> Save</button>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="fileInput" hidden accept=".json,.csv">
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
